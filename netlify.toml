# Netlify hosting for the WhiskNote web app (iPhone/Android "Add to Home Screen").
# VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY must be set in
# Netlify → Site configuration → Environment variables.

[build]
  command = "test -n \"$VITE_SUPABASE_URL\" && test -n \"$VITE_SUPABASE_ANON_KEY\" || { echo 'Missing VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY environment variables'; exit 1; }; npm run build:web"
  publish = "dist"
  # Skip the build (saves free-plan build credits) unless something that affects the web app changed
  # (exit 1 = build, exit 0 = skip; always build when there's no previous deploy to compare with)
  ignore = "[ -z \"$CACHED_COMMIT_REF\" ] || [ \"$CACHED_COMMIT_REF\" = \"$COMMIT_REF\" ] && exit 1; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src public index.html package.json package-lock.json vite.config.ts tsconfig.json netlify.toml"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: serve index.html for unknown paths
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# The service worker and app shell must always be revalidated so updates reach users
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Vite's hashed bundles never change, so they can be cached forever
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
