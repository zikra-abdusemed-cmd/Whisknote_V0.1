<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97753" />
      <stop offset="50%" stop-color="#C26343" />
      <stop offset="100%" stop-color="#9C4729" />
    </linearGradient>
    <linearGradient id="creamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#F7EEDB" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#542314" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />

  <!-- Inner Soft Inset Glow -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="6" />

  <!-- Whisk & Chef Icon Elements -->
  <g filter="url(#softShadow)" transform="translate(136, 116)">
    <!-- Chef Hat Base -->
    <path d="M40 180 C40 160 60 150 70 150 C65 130 80 90 120 90 C145 90 165 110 170 125 C185 105 215 115 215 145 C225 150 240 165 240 180 C240 195 230 200 215 205 L65 205 C50 200 40 195 40 180 Z" fill="url(#creamGrad)" opacity="0.95" />
    <rect x="65" y="200" width="150" height="24" rx="6" fill="#F4E6D2" />
    <line x1="75" y1="212" x2="205" y2="212" stroke="#C26343" stroke-width="3" stroke-linecap="round" stroke-opacity="0.4" />

    <!-- Stylized Whisk Wires (overlapping modern kitchen symbol) -->
    <g transform="translate(120, 100) rotate(-25)">
      <!-- Whisk loops -->
      <ellipse cx="0" cy="-30" rx="28" ry="48" fill="none" stroke="#FFFDF9" stroke-width="8" stroke-linecap="round" />
      <ellipse cx="0" cy="-30" rx="16" ry="44" fill="none" stroke="#FFFDF9" stroke-width="6" stroke-linecap="round" />
      <line x1="0" y1="18" x2="0" y2="75" stroke="#FFFDF9" stroke-width="10" stroke-linecap="round" />
      <circle cx="0" cy="80" r="7" fill="#F7EEDB" />
    </g>
  </g>

  <!-- Subtle Whisk Note Sparkle -->
  <path d="M380 90 Q390 110 410 120 Q390 130 380 150 Q370 130 350 120 Q370 110 380 90 Z" fill="#FFE8C2" opacity="0.85" />
  <path d="M120 370 Q126 382 138 388 Q126 394 120 406 Q114 394 102 388 Q114 382 120 370 Z" fill="#FFE8C2" opacity="0.6" />
</svg>
